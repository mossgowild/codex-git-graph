<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git Graph</title>
<style>
/* Codex supplies these values; keep the panel surface and neutral controls in the host palette. */
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, Canvas);
  --fg: var(--color-text-primary, CanvasText);
  --muted: var(--color-text-secondary, GrayText);
  --border: var(--color-border-secondary, color-mix(in srgb, CanvasText 12%, Canvas));
  --accent: var(--color-ring-primary, LinkText);
  --danger: var(--color-text-danger, CanvasText);
  --success: var(--color-text-success, CanvasText);
  --warning: var(--color-text-warning, CanvasText);
  --surface: color-mix(in srgb, var(--fg) 4%, var(--bg));
  --hover: color-mix(in srgb, var(--fg) 6%, var(--bg));
  --selected: color-mix(in srgb, var(--fg) 9%, var(--bg));
  font-family: var(--font-sans, system-ui);
  font-size: var(--font-text-sm-size, 13px);
  font-weight: var(--font-weight-normal, 400);
  line-height: 1.4;
  background: var(--bg); color: var(--fg);
}
* { box-sizing: border-box }
body { margin: 0 }
[hidden] { display: none !important }
button, input, select { font: inherit; color: inherit; min-width: 0 }
button, select { cursor: var(--interaction-cursor, default) }
button, input, select { border: 0; border-radius: var(--border-radius-sm, 6px); min-height: 28px; padding: 4px 8px; background: transparent }
button { display: inline-flex; align-items: center; justify-content: center; gap: 6px }
button:hover, select:hover { background: var(--hover) }
button:disabled { opacity: .35; cursor: default }
button:focus-visible, select:focus-visible, #search-field:focus-within { outline: 2px solid var(--accent); outline-offset: -2px }
input { background: var(--surface); border: 1px solid transparent }
input::placeholder { color: var(--muted); opacity: 1 }
select, select::picker(select) { appearance: base-select }
select { align-items: center; gap: 6px }
select:open { background: var(--hover) }
select::picker-icon { content: ''; width: 6px; height: 6px; flex: none; margin-inline: 3px; border: solid var(--muted); border-width: 0 1.4px 1.4px 0; transform: translateY(-1px) rotate(45deg) }
select::picker(select) {
  min-width: max(180px, anchor-size(self-inline)); max-width: calc(100vw - 16px); max-height: min(360px, calc(100dvh - 16px));
  margin-block: 4px; padding: 4px; border: .5px solid var(--border);
  border-radius: calc(var(--border-radius-xl, 12px) * 4 / 3);
  background: var(--color-background-secondary, var(--bg)); color: var(--fg);
  font: inherit; box-shadow: var(--shadow-lg); backdrop-filter: blur(8px); overflow: auto;
}
select option {
  display: flex; align-items: center; gap: 12px; min-height: 28px; padding: 5px 8px;
  border: 0; border-radius: var(--border-radius-xl, 12px); background: transparent; color: var(--fg);
  font-weight: var(--font-weight-normal, 400); cursor: var(--interaction-cursor, default); overflow-wrap: anywhere;
}
select option:hover, select option:focus { background: color-mix(in srgb, var(--fg) 8%, transparent); outline: none }
select option:checked { font-weight: var(--font-weight-normal, 400) }
select option::checkmark { order: 1; margin-left: auto; color: var(--fg) }
select optgroup { padding: 0; margin: 4px 0 0; font-weight: var(--font-weight-normal, 400) }
select legend { padding: 4px 8px; color: var(--muted); font-size: var(--font-text-sm-size, 13px) }
button svg { width: 16px; height: 16px; flex: none }
.spacer { flex: 1 }
#app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--bg) }
#toolbar { display: flex; align-items: center; gap: 4px; min-height: 40px; padding: 6px 10px }
#repo-label { max-width: 34%; padding-inline: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg) }
#branch { max-width: 50%; color: var(--muted); text-overflow: ellipsis }
#refresh { color: var(--muted) }
#searchbar { display: flex; align-items: center; gap: 2px; padding: 0 12px 8px; border-bottom: 1px solid var(--border) }
#search-field { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; background: var(--surface); border-radius: var(--border-radius-sm, 6px); padding-left: 8px; color: var(--muted) }
#search-field > svg { width: 14px; height: 14px; flex: none }
#search { flex: 1; width: 100%; background: transparent; border: 0; outline: none; border-radius: 0; padding-left: 0; color: var(--fg) }
#search-count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: var(--font-text-xs-size, 12px); white-space: nowrap; margin-inline: 6px }
.step { width: 28px; flex: none; padding: 4px; color: var(--muted) }
.error { padding: 8px 12px; background: color-mix(in srgb, var(--danger) 10%, var(--bg)); border-bottom: 1px solid var(--border); color: var(--danger); display: flex; gap: 8px; align-items: center }
.error span { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere }
#content { display: flex; flex: 1; min-height: 0 }
#history-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0 }
#history-table { width: 100%; min-width: var(--table-min-width, 476px) }
.columns, .commit-row { display: grid; grid-template-columns: var(--graph-width, 20px) var(--message-width, minmax(180px, 1fr)) var(--author-width, 100px) var(--date-width, 60px) var(--hash-width, 64px); align-items: center; justify-content: start; gap: 8px; padding: 0 12px 0 8px; width: 100% }
.columns { height: 26px; font-size: var(--font-text-xs-size, 12px); font-weight: var(--font-weight-normal, 400); color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1 }
.columns > span { position: relative; min-width: 0; align-self: stretch; display: flex; align-items: center }
.column-resize { position: absolute; top: 0; bottom: 0; right: -8px; width: 16px; cursor: col-resize; touch-action: none; user-select: none }
.column-resize::after { content: ''; position: absolute; top: 5px; bottom: 5px; left: 8px; width: 1px; background: var(--border) }
.column-resize:hover::after, .column-resize:focus-visible::after, .resizing .column-resize[data-active]::after { background: var(--accent) }
.column-resize:focus-visible { outline: none }
.column-resize[aria-disabled=true] { pointer-events: none }
.resizing, .resizing * { cursor: col-resize !important; user-select: none !important }
#history-scroll { flex: 1; overflow: auto; position: relative }
#rows { width: 100% }
.commit-row { height: 28px; width: 100%; border-radius: 0; text-align: left; background: transparent; white-space: nowrap }
.commit-row:hover { background: var(--hover) }
.commit-row[aria-selected=true] { background: var(--selected) }
.commit-row.is-match .subject { color: var(--accent) }
.commit-row svg { display: block; align-self: stretch; width: auto; height: 28px; overflow: visible }
.commit-row .message { display: flex; align-items: center; min-width: 0; gap: 6px; overflow: hidden }
.subject { overflow: hidden; text-overflow: ellipsis }
.author { overflow: hidden; text-overflow: ellipsis; color: var(--muted) }
.date, .hash { color: var(--muted); font-variant-numeric: tabular-nums; font-size: var(--font-text-xs-size, 12px); overflow: hidden; text-overflow: ellipsis }
.hash, code, pre { font-family: var(--font-mono, 'SFMono-Regular', Consolas, monospace) }
.ref { flex: none; font-size: var(--font-text-xs-size, 12px); line-height: 18px; height: 18px; border-radius: var(--border-radius-xs, 4px); padding: 0 5px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; background: var(--hover); color: var(--muted) }
.ref.tag { color: var(--warning) }
.ref.head { color: var(--accent) }
.empty { color: var(--muted); text-align: center; padding: 48px 20px; line-height: 1.8; overflow-wrap: anywhere }
.empty strong { display: block; color: var(--fg); font-weight: var(--font-weight-medium, 500); margin-bottom: 4px }
.history-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 12px; border-top: 1px solid var(--border); min-height: 28px; color: var(--muted); font-size: var(--font-text-xs-size, 12px) }
.readonly { margin-left: auto; white-space: nowrap }
#detail { width: 43%; min-width: 320px; max-width: 780px; border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0 }
#detail-header { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-bottom: 1px solid var(--border) }
#detail-hash { font-size: var(--font-text-xs-size, 12px); color: var(--muted) }
#copy-hash { color: var(--muted) }
#close-detail { margin-left: auto; color: var(--muted) }
#detail-summary { padding: 12px; border-bottom: 1px solid var(--border); overflow: auto; max-height: 33%; flex-shrink: 0 }
#commit-message { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; margin: 0 0 8px }
#commit-meta { font-size: var(--font-text-xs-size, 12px); line-height: 1.7; color: var(--muted); overflow-wrap: anywhere }
#parent-label { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--muted); font-size: var(--font-text-xs-size, 12px) }
#parent { max-width: 100%; font-family: var(--font-mono, monospace); font-size: var(--font-text-xs-size, 12px) }
.files-label { padding: 8px 12px 4px; color: var(--muted); font-size: var(--font-text-xs-size, 12px) }
#files { max-height: 26%; min-height: 36px; overflow: auto; padding: 0 6px 6px; flex-shrink: 0 }
#files button { border-radius: var(--border-radius-sm, 6px); display: flex; justify-content: flex-start; width: 100%; gap: 8px; text-align: left; padding: 4px 6px; font-size: var(--font-text-sm-size, 13px) }
#files button[aria-pressed=true] { background: var(--selected) }
.file-status { flex: none; margin-left: auto; color: var(--muted); font-family: var(--font-mono, monospace); font-size: var(--font-text-xs-size, 12px) }
.file-status.A { color: var(--success) }
.file-status.D { color: var(--danger) }
.file-path, .file-directory { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.file-directory { color: var(--muted); max-width: 45%; font-size: var(--font-text-xs-size, 12px) }
#diff-toolbar { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 2px 6px 2px 12px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border) }
#diff-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--font-text-xs-size, 12px); color: var(--muted) }
#open-file { flex: none; color: var(--muted) }
#patch { flex: 1; min-height: 60px; overflow: auto; margin: 0; font-size: var(--font-text-xs-size, 12px); line-height: 1.7; tab-size: 4; padding: 6px 0 }
#patch .line { display: block; min-width: 100%; width: max-content; padding: 0 12px; white-space: pre }
.line.add { background: var(--color-background-success, color-mix(in srgb, var(--success) 12%, var(--bg))); color: var(--success) }
.line.remove { background: var(--color-background-danger, color-mix(in srgb, var(--danger) 12%, var(--bg))); color: var(--danger) }
.line.hunk { color: var(--muted); background: var(--surface); margin: 4px 0 }
.line.header { color: var(--muted) }
#patch .notice { white-space: pre-wrap; width: auto; color: var(--muted); padding: 12px; display: block }
@media (max-width: 1000px) {
  #content { flex-direction: column }
  #detail { width: 100%; max-width: none; min-width: 0; height: 50%; border-left: 0; border-top: 1px solid var(--border); flex-shrink: 0 }
  #detail-summary { max-height: 30%; padding: 8px 12px }
  #files { max-height: 22% }
  #history-pane { min-height: 100px }
}
@media (max-width: 540px) {
  #search-count { font-size: var(--font-text-xs-size, 12px) }
}
</style>
</head>
<body>
<main id="app">
  <div id="toolbar" hidden>
    <span id="repo-label" aria-label="当前任务仓库"></span>
    <select id="branch" aria-label="筛选分支"></select><span class="spacer"></span>
    <button id="refresh" title="重新读取仓库" aria-label="刷新"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a6.2 6.2 0 1 0 .1 4M16 3v5h-5"/></svg></button>
  </div>
  <div id="searchbar" hidden>
    <label id="search-field"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg><input id="search" type="search" aria-label="搜索已加载的提交" placeholder="搜索提交、作者或 SHA"></label>
    <span id="search-count" role="status"></span>
    <button class="step" id="prev-match" title="上一个匹配" aria-label="上一个匹配"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 16V4m-5 5 5-5 5 5"/></svg></button>
    <button class="step" id="next-match" title="下一个匹配" aria-label="下一个匹配"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4v12m-5-5 5 5 5-5"/></svg></button>
  </div>
  <div id="error" class="error" role="alert" hidden><span></span><button id="retry">重试</button><button id="dismiss-error" aria-label="关闭错误">×</button></div>
  <div id="layout-error" class="error" role="alert" hidden><span></span><button id="layout-retry">重试</button></div>
  <div id="content">
    <section id="history-pane" aria-label="提交历史">
      <div id="history-scroll"><div id="history-table"><div id="columns" class="columns" hidden><span aria-label="关系图"></span><span>提交</span><span>作者</span><span>日期</span><span>SHA</span></div><div id="rows" role="listbox" aria-label="Git 提交列表"></div></div><div id="empty" class="empty"><strong>正在读取当前任务的 Git 仓库</strong>浏览分支关系，选择提交查看文件差异。</div></div>
      <footer class="history-footer"><span id="history-status" role="status">正在读取当前任务仓库…</span><span class="readonly" title="Git Graph 0.2.1 · 所有 Git 操作只读">只读</span><button id="load-more" hidden>加载更多</button></footer>
    </section>
    <aside id="detail" aria-label="提交详情" hidden>
      <div id="detail-header"><code id="detail-hash"></code><button id="copy-hash" title="复制完整提交 SHA">复制</button><button id="close-detail" aria-label="关闭提交详情">×</button></div>
      <div id="detail-summary"><p id="commit-message"></p><div id="commit-meta"></div><label id="parent-label" hidden>对比父提交<select id="parent" aria-label="选择对比的父提交"></select></label></div>
      <div class="files-label" id="files-label">变更文件</div><div id="files"></div>
      <div id="diff-toolbar"><span id="diff-title">选择文件查看差异</span><button id="open-file" hidden disabled title="在 Codex 中打开工作区文件（当前内容）" aria-label="在 Codex 中打开工作区文件"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3h6v6m0-6-8 8M8 4H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-3"/></svg></button></div><pre id="patch" tabindex="0" aria-label="文件差异"></pre>
    </aside>
  </div>
</main>
<script>/* APP_SCRIPT */</script>
</body>
</html>
